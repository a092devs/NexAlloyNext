name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Write key
      if: github.event_name != 'pull_request'
      run: |
        if [ -z "${{ secrets.KEYSTORE }}" ]; then
          echo "::warning::Signing secrets are missing, the release APK is not built. Add KEYSTORE (base64), KEYSTORE_PASSWORD, KEYSTORE_ALIAS and KEYSTORE_ALIAS_PASSWORD in Settings > Secrets and variables > Actions."
          exit 0
        fi
        echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} > signing.properties
        echo KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
        echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
        echo KEYSTORE_FILE=../key.jks >> signing.properties
        echo ${{ secrets.KEYSTORE }} | base64 --decode > key.jks

    - name: Unit tests
      run: ./gradlew testDebugUnitTest

    - name: Build module
      run: ./gradlew :app:assembleDebug

    - name: Build release module
      if: hashFiles('signing.properties') != ''
      run: ./gradlew :app:assembleRelease

    - name: Upload module
      uses: actions/upload-artifact@v7
      with:
        name: nexalloy-ci-debug-apk
        path: app/build/outputs/apk/debug

    - name: Create AutoBuild Release
      if: github.event_name == 'push' && hashFiles('signing.properties') != ''
      run: |
        GIT_DESCRIBE=$(git rev-parse --short HEAD)
        mkdir autobuild
        cp app/build/outputs/apk/release/app-release.apk autobuild/NexAlloyNext-${GIT_DESCRIBE}.apk
        gh release delete autobuild --cleanup-tag --yes || true
        gh release create autobuild autobuild/* \
          --prerelease \
          --target "${{ github.sha }}" \
          --title "Nightly Build ${GIT_DESCRIBE}" \
          --notes "Nightly build from commit ${GIT_DESCRIBE}."
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-release:
    name: Auto release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    concurrency:
      group: auto-release
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v7

    - name: Dispatch release workflow for the current version
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
        NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
        VERSION="${NAME//\$versionCode/$CODE}"
        echo "Resolved release version: $VERSION"

        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
          echo "::error::Could not resolve a release version from app/build.gradle.kts (got '$VERSION')."
          exit 1
        fi

        if gh release view "$VERSION" >/dev/null 2>&1; then
          echo "Release $VERSION already exists; nothing to release."
          exit 0
        fi

        gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$VERSION"
        echo "Dispatched the release workflow for $VERSION."
